name: Verify performance skill
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test skills/jigx-performance/scripts/check-performance.test.mjs
      - run: python3 -m unittest skills/jigx-performance/scripts/test_profile_query.py
      - run: python3 -m unittest skills/jigx-performance/scripts/test_load_tools.py
